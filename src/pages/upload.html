<section class="page">
  <h1 class="header_upload">Upload Files</h1>
  <label for="filePicker" class="file-picker-trigger">
    <img src="{{placeholderSrc}}" alt="Choose a PDF file" class="file-picker-image" />
  </label>
  <input type="file" id="filePicker" accept="application/pdf" class="visually-hidden" />
  <p id="status" class="status">Choose a PDF to upload.</p>


</section>
